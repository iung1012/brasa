services:

  # ── Banco de dados ─────────────────────────────────────────────
  db:
    image: postgis/postgis:16-3.4
    restart: always
    env_file: .env.production
    environment:
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [brasa]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Cache ──────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASS}
    volumes:
      - redisdata:/data
    networks: [brasa]

  # ── API ────────────────────────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: always
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASS}@db:5432/${DB_NAME}
      REDIS_URL:    redis://:${REDIS_PASS}@redis:6379
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks: [brasa]
    expose: ["3333"]

  # ── Web (build estático servido pelo nginx interno) ────────────
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: always
    networks: [brasa]
    expose: ["80"]

  # ── Proxy reverso ──────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on: [api, web]
    networks: [brasa]

  # ── Renovação automática de SSL ────────────────────────────────
  certbot:
    image: certbot/certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: >
      sh -c "trap exit TERM;
             while :; do
               certbot renew --webroot -w /var/www/certbot --quiet;
               sleep 12h & wait $$!;
             done"

volumes:
  pgdata:
  redisdata:
  uploads:
  certbot_www:
  certbot_conf:

networks:
  brasa:
    driver: bridge
