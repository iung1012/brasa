services:
  db:
    image: postgis/postgis:16-3.4
    container_name: brasa_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: brasa
      POSTGRES_PASSWORD: brasa_dev_pwd
      POSTGRES_DB: brasa
    ports:
      - "5432:5432"
    volumes:
      - brasa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brasa -d brasa"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: brasa_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - brasa_redisdata:/data

volumes:
  brasa_pgdata:
  brasa_redisdata:
