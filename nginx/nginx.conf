worker_processes auto;
events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;
    gzip_types    text/plain text/css application/javascript application/json image/svg+xml;
    client_max_body_size 35M;   # permite uploads de até 30MB + margem

    # redireciona HTTP → HTTPS
    server {
        listen 80;
        server_name SEU_DOMINIO.com www.SEU_DOMINIO.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS principal
    server {
        listen 443 ssl http2;
        server_name SEU_DOMINIO.com www.SEU_DOMINIO.com;

        ssl_certificate     /etc/letsencrypt/live/SEU_DOMINIO.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/SEU_DOMINIO.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        add_header Strict-Transport-Security "max-age=31536000" always;

        # API + Socket.io
        location /api/ {
            proxy_pass         http://api:3333/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;   # suporte a WebSocket longo
        }

        # Arquivos de upload
        location /uploads/ {
            proxy_pass http://api:3333/uploads/;
        }

        # Frontend (SPA)
        location / {
            proxy_pass http://web:80;
            proxy_set_header Host $host;
        }
    }
}
